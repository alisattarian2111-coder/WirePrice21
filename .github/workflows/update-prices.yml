
name: Update cable prices

on:
  workflow_dispatch:
  schedule:
    - cron: '25 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fix output path
        run: sed -i 's/parents\[1\]/parent/' update_prices.py

      - name: Collect public price lists
        run: python update_prices.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Update cable prices"
          git push
